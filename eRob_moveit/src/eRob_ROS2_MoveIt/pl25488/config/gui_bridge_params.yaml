gui_bridge:
  ros__parameters:
    planning_group: "manipulator"
    end_effector_link: "tcp"
    base_frame: "base_link"
    joint_names: ["j1", "j2", "j3", "j4", "j5", "j6"]

    velocity_scaling: 0.9
    acceleration_scaling: 0.8

    planning_time: 2.0
    planning_attempts: 10

    cartesian_step_size: 0.05
    cartesian_jump_threshold: 0.0
    cartesian_min_fraction: 0.25

    start_state_tolerance: 0.1
