URDF_PATH: erob_arm_small.urdf
SRDF_PATH: eRobo3.srdf
CARTESIAN_SOURCE_LINK: ee_link
COLLISION_TIP_LINK: tool0
DEFAULT_WORKOBJECT:
- 0
- 0
- 0
- 0
- 0
- 16.2


# Painting: keep MoveIt collision checks enabled for planned paint motion.
ENABLE_COLLISION_CHECKING: true
CONTOUR_STATE_VALIDITY_ENABLED: true
CONTOUR_STATE_VALIDITY_STRIDE: 1

# Dynamic MoveIt collision body for the selected paint tool. The platform
# switches to TOOL_1 at startup; this attaches a cylinder at that active tool
# origin so collision checks include the physical pointer/sprayer.
ACTIVE_TOOL_COLLISION_ENABLED: true
ACTIVE_TOOL_COLLISION_ID: active_paint_tool
ACTIVE_TOOL_COLLISION_LINK: ee_link
ACTIVE_TOOL_COLLISION_RADIUS_M: 0.0325
ACTIVE_TOOL_COLLISION_LENGTH_M: 0.17
ACTIVE_TOOL_COLLISION_ORIGIN:
- 0
- 0
- -85
- 0
- 0
- 0
ACTIVE_TOOL_COLLISION_USE_ACTIVE_TOOL_TRANSFORM: true
ACTIVE_TOOL_COLLISION_TOUCH_LINKS:
- ee_link
- tool0
- tcp
- Link_6

# Dense paint contours use direct IK plus TOTG timing. Ruckig can introduce
# implausible local timing gaps on these long wrapped Joint_6 paths.
PATH_TRAJECTORY_OPTIMIZER: TOTG

# Paint contour execution: enable the dense direct-IK path only for this
# profile. The detailed IK tolerances live in erob_moveit_runtime/scripts/config.py.
CONTOUR_DIRECT_IK_ENABLED: true
CONTOUR_BATCH_IK_SERVICE_TIMEOUT_S: 30.0
CONTOUR_IK_RETRY_TIMEOUT_S: 0.05

# Cartesian fallback tuning for dense paint paths. Larger EEF steps and waypoint
# simplification reduce MoveIt fallback planning time; direct IK remains the
# preferred path when available.
PATH_EEF_STEP_SCALE: 3.0
PATH_EEF_STEP_MIN_M: 0.012
PATH_EEF_STEP_MAX_M: 0.050
PATH_WAYPOINT_SIMPLIFY_ENABLED: false
PATH_WAYPOINT_SIMPLIFY_MAX_TRANSLATION_MM: 30.0
PATH_WAYPOINT_SIMPLIFY_MAX_ORIENTATION_DEG: 1.0
FOLLOW_PATH_CARTESIAN_TIMEOUT_S: 30.0
FOLLOW_PATH_CARTESIAN_FALLBACK_ENABLED: false
FOLLOW_PATH_DENSIFY_MAX_TRANSLATION_MM: 1.0
FOLLOW_PATH_DENSIFY_MAX_ORIENTATION_DEG: 2.0

# Paint unwind is intentional because the hose/camera cable can wrap around
# Joint_6 unwind uses rotational direct IK to avoid MoveIt Cartesian planning.
EXECUTOR_POST_UNWIND_ROTATION_AXIS_INDEX: 5
EXECUTOR_POST_UNWIND_ROTATION_AXIS_SIGN: -1.0
EXECUTOR_POST_UNWIND_ROTATIONAL_SEGMENT_DEG: 180.0
EXECUTOR_POST_UNWIND_USE_DIRECT_IK: true
EXECUTOR_POST_UNWIND_DIRECT_IK_FALLBACK_CARTESIAN: true
EXECUTOR_POST_UNWIND_DIRECT_IK_STEP_DEG: 4.0
EXECUTOR_POST_UNWIND_DIRECT_IK_OPTIMIZER: ''

TOOL_REGISTRY:
  TOOL_0:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  TOOL_1:
  - -0.157283595676
  - -0.140764944892
  - 164.548690347
  - 0
  - 0
  - 0
TOOL_ID_MAP:
  0: TOOL_0
  1: TOOL_1
