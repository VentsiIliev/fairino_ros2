  - 168.550614477
  - 0
  - 0
  - 0
TOOL_ID_MAP:
  0: TOOL_0
  1: TOOL_1
# Use Pilz CommandPlanner LIN for single-target /move/linear requests.
MOVE_LIN_STRATEGY: cartesian_path
