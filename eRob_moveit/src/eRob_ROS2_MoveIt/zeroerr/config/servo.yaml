update_period: 0.01
publish_period: 0.01
# Keep the rolling trajectory horizon short so Cartesian Servo stop commands
# take effect promptly. At 250 mm/s, the previous 100 ms horizon could leave
# up to 25 mm of already-scheduled motion after a stop request.
max_expected_latency: 0.03

command_in_type: "speed_units"

scale:
  linear: 0.2
  rotational: 0.8
  joint: 0.5

command_out_type: trajectory_msgs/JointTrajectory

publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

# The local ZeroErr Servo node owns its PlanningSceneMonitor state.
is_primary_planning_scene_monitor: true

check_octomap_collisions: false

# IMPORTANT: verify this against your SRDF
move_group_name: manipulator
planning_group_name: manipulator

# ZeroErr working poses can sit close to wrist singularity according to Servo's
# condition metric. Keep singularity protection, but do not scale ordinary jog
# commands to near-zero as early as the conservative demo defaults.
lower_singularity_threshold: 25.0
hard_stop_singularity_threshold: 60.0
leaving_singularity_threshold_multiplier: 2.0

joint_limit_margins: [0.12]

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds

joint_topic: /joint_states
monitored_planning_scene_topic: /monitored_planning_scene
status_topic: ~/status

command_out_topic: /manipulator_controller/joint_trajectory

check_collisions: true
collision_check_rate: 10.0

self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
