# MoveIt Move Group Configuration
move_group:
  ros__parameters:
    planning_scene_monitor.name: "planning_scene_monitor"
    planning_scene_monitor.robot_description: "robot_description"
    planning_scene_monitor.joint_state_topic: "/joint_states"
    planning_scene_monitor.attached_collision_object_topic: "/attached_collision_object"
    planning_scene_monitor.publish_planning_scene: true
    planning_scene_monitor.publish_geometry_updates: true
    planning_scene_monitor.publish_state_updates: true
    planning_scene_monitor.publish_transforms_updates: true
    planning_scene_monitor.publish_robot_description: true
    planning_scene_monitor.publish_robot_description_semantic: true
    planning_scene_monitor.publish_planning_scene_hz: 10.0
    # Trajectory execution parameters
    trajectory_execution.allowed_execution_duration_scaling: 5.0
    trajectory_execution.allowed_goal_duration_margin: 5.0
    # Tight start tolerance — large value (0.05 rad) causes a positional jump
    # at the start of every trajectory segment (robot snaps to start pose).
    trajectory_execution.allowed_start_tolerance: 0.01
    trajectory_execution.execution_duration_monitoring: false
    trajectory_execution.trajectory_execution_manager.wait_for_trajectory_completion: false
    trajectory_execution.cartesian_speed_limited_link: "tcp"
    trajectory_execution.monitor_overshoot: false
    collision_detection:
      plugin: "collision_detection/CollisionPluginFCL"
      check_for_collisions: false
      check_for_self_collisions: false
      check_for_environment_collisions: false
      collision_detector_plugin: "FCL"
      contacts_threshold: 1
    planning_pipelines: ["pilz_industrial_motion_planner"]
    default_planning_pipeline: "pilz_industrial_motion_planner"
    pilz_industrial_motion_planner:
      planning_plugin: "pilz_industrial_motion_planner/CommandPlanner"
      request_adapters: >-
        default_planning_request_adapters/ResolveConstraintFrames
        default_planning_request_adapters/ValidateWorkspaceBounds
        default_planning_request_adapters/CheckStartStateBounds
      # TOTG only — no Ruckig post-smoother.  Ruckig modifies waypoint timings
      # in ways that conflict with the FC cubic-Hermite re-timing done in
      # gui_bridge._resample_trajectory_smooth, doubling the smoothing and
      # creating velocity overshoots.  TOTG gives geometrically correct knots;
      # gui_bridge re-times them with Fritsch-Carlson + Hermite densification.
      response_adapters: >-
        default_planning_response_adapters/AddTimeOptimalParameterization
        default_planning_response_adapters/ValidateSolution
        default_planning_response_adapters/DisplayMotionPath
      default_planner_config: "LIN"
