# Runtime backend identifier used by the shared runtime factory.
ROBOT_BACKEND: zeroerr

# Active robot profile. Profile-specific overrides live under config/<profile>/.
ACTIVE_PROFILE: paint
#ACTIVE_PROFILE: welding

# Enables the EtherCAT OP-state watchdog before allowing motion.
ETHERCAT_WATCHDOG_ENABLED: true

# Request OP again when the watchdog sees slaves drop from OP. Motion remains
# interlocked until all slaves are observed back in OP.
ETHERCAT_RECOVERY_ENABLED: true
ETHERCAT_RECOVERY_MIN_INTERVAL_S: 2.0
ETHERCAT_RECOVERY_CMD_TIMEOUT_S: 2.0

# Global collision checking toggle. Set to false to disable all collision
# avoidance (useful for painting/welding where tool may be in contact).
# When false, all avoid_collisions parameters default to False.
ENABLE_COLLISION_CHECKING: true

# Number of controlled robot joints.
NUM_JOINTS: 6

# Joint names in controller and MoveIt trajectory order.
JOINT_NAMES:
- Joint_1
- Joint_2
- Joint_3
- Joint_4
- Joint_5
- Joint_6

# MoveIt planning group name.
PLANNING_GROUP: manipulator

# Dedicated group used only by /move/fast_lin. It has a low-latency IK policy
# in kinematics.yaml; all other backend planning stays on PLANNING_GROUP.
FAST_LIN_PLANNING_GROUP: manipulator_fast

# Root frame for planning and FK/IK requests.
BASE_LINK: base_link

# End-effector link used for IK, FK, and planning requests.
EE_LINK: ee_link

# Wrist link used by diagnostics and wrist-specific logic.
WRIST_LINK: Link_6

# TF link published on /cartesian_position before runtime tool transforms.
# Keep separate from EE_LINK so MoveIt can plan with ee_link while current-pose
# reporting and TCP calibration can use the physical tool/flange reference.
CARTESIAN_SOURCE_LINK: ee_link

# Link treated as the collision/tool tip for safety monitoring.
COLLISION_TIP_LINK: tool0

# Robot URDF used by runtime helpers and dynamics/collision tools.
#URDF_PATH: urdfs/erob_arm_family_motor_masses.urdf
URDF_PATH: urdfs/erob_arm_small.urdf

# FollowJointTrajectory action used by the low-level controller.
ACTION_FOLLOW_TRAJECTORY: /manipulator_controller/follow_joint_trajectory

# Real ZeroErr drives can briefly transition around adjacent controller goals.
# Require a short stable enabled window before sending the next trajectory.
EXECUTOR_DRIVE_ENABLE_STABLE_BEFORE_TRAJECTORY_S: 0.0

# Automatically request drive operation enable once EtherCAT is fully OP and
# controller services are available. This makes /drive/status report
# requested_enabled/actual_enabled without requiring the frontend to press
# enable after every startup.
STARTUP_AUTO_ENABLE_DRIVES: true
STARTUP_AUTO_ENABLE_DRIVES_TIMEOUT_S: 30.0
STARTUP_AUTO_ENABLE_DRIVES_RETRY_PERIOD_S: 1.0
STARTUP_AUTO_ENABLE_DRIVES_VERIFY_TIMEOUT_S: 5.0

# Default trajectory time-parameterization backend.
TRAJECTORY_OPTIMIZER: RUCKIG

# Disabled until the linked-LIN helper preserves per-segment LIN trajectories
# and returns boundaries for the existing BlendBuilder path.
LINKED_LIN_HELPER_ENABLED: false
LINKED_LIN_CARTESIAN_STEP_M: 0.020

# Legacy helper cleanup knobs are inactive while LINKED_LIN_HELPER_ENABLED is
# false. Keep them here only so a future helper redesign has explicit limits.
LINKED_LIN_MICRO_REVERSAL_CLEANUP_ENABLED: true
LINKED_LIN_MICRO_REVERSAL_MIN_ANGLE_DEG: 175.0
LINKED_LIN_MICRO_REVERSAL_MAX_LEG_RAD: 0.002
LINKED_LIN_MICRO_REVERSAL_MAX_ENDPOINT_RAD: 0.0001
LINKED_LIN_NEAR_DUPLICATE_RAD: 0.00001

# Log blended trajectory peak interval rates, but do not stretch timing here.
# If a specific drive limit is proven necessary, add it under this map.
ORDERED_BLEND_JOINT_RATE_GUARD_ENABLED: true
ORDERED_BLEND_JOINT_RATE_LIMITS_RAD_S: {}

# Shared Cartesian path defaults. Profiles can override these for process-
# specific dense paths such as paint contours.
PATH_EEF_STEP_SCALE: 1.35
PATH_EEF_STEP_MIN_M: 0.005
PATH_EEF_STEP_MAX_M: 0.015
PATH_WAYPOINT_SIMPLIFY_ENABLED: false
PATH_WAYPOINT_SIMPLIFY_POSITION_TOL_MM: 0.35
PATH_WAYPOINT_SIMPLIFY_ORIENTATION_TOL_DEG: 0.35
PATH_WAYPOINT_SIMPLIFY_MAX_TRANSLATION_MM: 12.0
PATH_WAYPOINT_SIMPLIFY_MAX_ORIENTATION_DEG: 4.0

# Dense contour IK settings live in contour_ik_config.yaml.
# Profiles can override them in config/<ACTIVE_PROFILE>/contour_ik_config.yaml.

# Enables heavy Cartesian partial-failure diagnostics. When true, failed linear
# moves probe failed poses with IK/collision/branch variants. Keep false during
# normal operation because it adds extra MoveIt service calls and noisy logs.
CARTESIAN_FAILURE_DIAGNOSTICS_ENABLED: false

# PTP target selection and pre-execution check settings live in ptp_config.yaml.
# Profiles can override them in config/<ACTIVE_PROFILE>/ptp_config.yaml.

# Defaults for optional explicit/post-success Joint_6 unwind moves.
EXECUTOR_POST_UNWIND_SPEED_RAD_S: 1.8
EXECUTOR_POST_UNWIND_ACCEL_RAD_S2: 2.5
EXECUTOR_POST_UNWIND_JOINT_RATE_LIMIT_RAD_S: 1.2
EXECUTOR_POST_UNWIND_JOINT_ACCEL_LIMIT_RAD_S2: 2.5
EXECUTOR_POST_UNWIND_MAX_SEGMENT_RAD: 1.2
EXECUTOR_POST_UNWIND_SAMPLE_PERIOD_S: 0.05
EXECUTOR_POST_UNWIND_VERIFY_TOL_RAD: 0.12
EXECUTOR_POST_UNWIND_VERIFY_TIMEOUT_S: 0.5

# Tool transforms keyed by tool name, [x, y, z, rx, ry, rz] in mm/degrees.
TOOL_REGISTRY:
  TOOL_0:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0

# Numeric tool IDs accepted by the API mapped to TOOL_REGISTRY keys.
TOOL_ID_MAP:
  0: TOOL_0

# REST server log file path.
REST_LOG: /tmp/zeroerr_rest_server.log

# Read-only WebSocket telemetry stream for GUI clients.
REST_WS_STATE_ENABLED: true
REST_WS_STATE_HOST: 0.0.0.0
REST_WS_STATE_PORT: 5001
REST_WS_STATE_RATE_HZ: 10.0
REST_WS_EXECUTION_ENABLED: true
REST_WS_EXECUTION_HOST: 0.0.0.0
REST_WS_EXECUTION_PORT: 5002
REST_WS_EXECUTION_RATE_HZ: 10.0

# Publish /robot_status from the runtime controller.
ROBOT_STATUS_PUBLISH_ENABLED: false

# Publish interval for RViz/planning-scene marker updates.
MARKER_PUBLISH_INTERVAL_S: 30.0

# Active TCP/tool visualization marker rate. This is RViz/operator
# visualization only; attached collision geometry is published separately when
# the active tool changes/initializes.
ACTIVE_TOOL_MARKER_PUBLISH_HZ: 1.0

# Enables runtime safety wall collision objects around the extracted workspace.
SAFETY_WALLS_ENABLED: false

RUNTIME_HEADLESS: 1

# Jacobian Cartesian fallback settings live in jacobian_config.yaml.
# Profiles can override them in config/<ACTIVE_PROFILE>/jacobian_config.yaml.

# REDUCE CPU LOAD

# Debug-only SDO fault-code polling. Enable only while diagnosing drive errors.
ZEROERR_ERROR_MONITOR_ENABLED: false

# Low-rate SDO diagnostics for values intentionally kept out of fast PDOs.
ZEROERR_DRIVE_DIAGNOSTICS_ENABLED: true
ZEROERR_DRIVE_DIAGNOSTICS_POLL_PERIOD_S: 5.0

MONITOR_UPDATE_RATE_HZ: 10.0

STATE_PUBLISH_RATE_HZ: 10.0
JOINT_DERIVATIVE_PUBLISH_RATE_HZ: 10.0
JOINT_STATE_INPUT_RATE_HZ: 10.0

RUNTIME_JOINT_STATE_INPUT_RATE_HZ: 10.0
RUNTIME_DYNAMIC_STATE_INPUT_RATE_HZ: 10.0
