# Legacy default launcher config.
#
# Prefer the explicit per-robot entrypoints instead:
#   ./launch_fairino.sh
#   ./launch_zeroerr.sh
#
# Or select the config directly:
#   ROBOT_LAUNCH_CONFIG=./fairino_launch.conf ./launch_robot.sh
#   ROBOT_LAUNCH_CONFIG=./zeroerr_launch.conf ./launch_robot.sh
#
# This file remains as a compatibility default and currently maps to the
# Fairino stack.

ROBOT_TYPE=fairino
BUILD_WORKSPACE=0
USE_RVIZ=false

WORKSPACE_DIR="${SCRIPT_DIR}"
ROS_SETUP_FILE="${ROS_SETUP_FILE:-${DEFAULT_ROS_SETUP_FILE}}"
BASE_UNDERLAY_SETUP_FILE="${ROOT_WS_DIR}/install/local_setup.bash"
WORKSPACE_SETUP_FILE="${SCRIPT_DIR}/install/local_setup.bash"

FAIRINO_PACKAGE=fairino5_v6_moveit2_config
FAIRINO_LAUNCH_FILE=demo.launch.py
