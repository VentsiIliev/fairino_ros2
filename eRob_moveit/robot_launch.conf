# Shared robot launcher config
#
# Valid ROBOT_TYPE values:
#   fairino  -> launches fairino5_v6_moveit2_config/demo.launch.py
#   zeroerr  -> launches zeroerr/demo.launch.py and then runs the ZeroErr EtherCAT setup script
#
# Typical usage:
#   cd /home/ilv/ros2_ws
#   ./launch_robot.sh
#
# Optional overrides:
#   ROBOT_LAUNCH_CONFIG=/path/to/other.conf ./launch_robot.sh
#   BUILD_WORKSPACE=1 will run colcon build in WORKSPACE_DIR before launching

# Which robot stack to launch.
ROBOT_TYPE=fairino

# Set to 1 to build the workspace before launch, 0 to skip build.
BUILD_WORKSPACE=0

# Root of the ROS workspace that contains the built install/ tree.
WORKSPACE_DIR=/home/ilv/ros2_ws/eRob_moveit

# Base ROS distro setup file.
ROS_SETUP_FILE=/opt/ros/rolling/setup.bash

# Base workspace underlay that provides hardware/vendor packages used by the shared runtime.
BASE_UNDERLAY_SETUP_FILE=/home/ilv/ros2_ws/install/local_setup.bash

# Workspace overlay setup file that must expose the selected config package and erob_moveit_runtime.
WORKSPACE_SETUP_FILE=/home/ilv/ros2_ws/eRob_moveit/install/local_setup.bash

# Fairino launch target.
FAIRINO_PACKAGE=fairino5_v6_moveit2_config
FAIRINO_LAUNCH_FILE=demo.launch.py

# ZeroErr launch target.
# ZEROERR_PROFILE options:
#   ethercat_only -> starts ros2_control + robot_state_publisher only, then runs EtherCAT setup and opens slave monitor terminal
#   full          -> starts the full ZeroErr MoveIt stack
ZEROERR_PROFILE=full
ZEROERR_PACKAGE=zeroerr
ZEROERR_LAUNCH_FILE=demo.launch.py
ZEROERR_MINIMAL_LAUNCH_FILE=ethercat_only.launch.py

# Host-level ZeroErr post-launch setup.
# This script is run after the ROS launch starts and is expected to configure EtherCAT / RT settings.
ZEROERR_ETHERCAT_SCRIPT=/home/ilv/ros2_ws/eRob_moveit/src/eRob_ROS2_MoveIt/zeroerr/scripts/EtherCatStart.sh
ZEROERR_SLAVE_MONITOR_SCRIPT=/home/ilv/ros2_ws/eRob_moveit/src/eRob_ROS2_MoveIt/zeroerr/scripts/PollEthercat.sh
