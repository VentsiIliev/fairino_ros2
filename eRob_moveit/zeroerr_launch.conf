# ZeroErr launcher config

ROBOT_TYPE=zeroerr
BUILD_WORKSPACE=0
USE_RVIZ=true
ROBOT_ROS_DOMAIN_ID=42
ROBOT_ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
ROBOT_ROS_LOCALHOST_ONLY=1

WORKSPACE_DIR="${ROOT_WS_DIR}"
ROS_SETUP_FILE="${ROS_SETUP_FILE:-${DEFAULT_ROS_SETUP_FILE}}"
BASE_UNDERLAY_SETUP_FILE=
WORKSPACE_SETUP_FILE="${ROOT_WS_DIR}/install/local_setup.bash"

ZEROERR_PROFILE=full
ZEROERR_PACKAGE=zeroerr
ZEROERR_LAUNCH_FILE=demo.launch.py
ZEROERR_MINIMAL_LAUNCH_FILE=ethercat_only.launch.py

ZEROERR_NIC=enp3s0

ZEROERR_CPU_COUNT="$(nproc --all 2>/dev/null || echo 4)"

zeroerr_kernel_isolated_cores() {
  tr ' ' '\n' < /proc/cmdline 2>/dev/null \
    | awk -F= '/^(isolcpus|nohz_full)=/ {print $2; exit}' \
    | sed 's/managed_irq,//g; s/domain,//g; s/nohz,//g' || true
}

zeroerr_cpu_list_last() {
  python3 - "$1" <<'PY'
import sys
cpus = []
for part in sys.argv[1].split(","):
    part = part.strip()
    if not part:
        continue
    if "-" in part:
        start, end = [int(value) for value in part.split("-", 1)]
        cpus.extend(range(start, end + 1))
    else:
        cpus.append(int(part))
print(max(cpus))
PY
}

zeroerr_cpu_list_except() {
  python3 - "$1" "$2" <<'PY'
import sys

def expand(value):
    cpus = set()
    for part in str(value).split(","):
        part = part.strip()
        if not part:
            continue
        if "-" in part:
            start, end = [int(item) for item in part.split("-", 1)]
            cpus.update(range(start, end + 1))
        else:
            cpus.add(int(part))
    return cpus

def compact(cpus):
    if not cpus:
        return ""
    values = sorted(cpus)
    ranges = []
    start = previous = values[0]
    for value in values[1:]:
        if value == previous + 1:
            previous = value
            continue
        ranges.append((start, previous))
        start = previous = value
    ranges.append((start, previous))
    return ",".join(str(a) if a == b else f"{a}-{b}" for a, b in ranges)

print(compact(expand(sys.argv[1]) - expand(sys.argv[2])))
PY
}

ZEROERR_KERNEL_ISOLATED_CORES="$(zeroerr_kernel_isolated_cores)"
ZEROERR_ALL_CORES="0-$((ZEROERR_CPU_COUNT - 1))"

if [ -n "$ZEROERR_KERNEL_ISOLATED_CORES" ]; then
  # Honor the kernel RT layout first. On the current dev machine this is
  # isolcpus=2,3, so core 3 stays RT/control and core 2 can help planning.
  ZEROERR_DEFAULT_CONTROL_CORES="$(zeroerr_cpu_list_last "$ZEROERR_KERNEL_ISOLATED_CORES")"
  ZEROERR_DEFAULT_NON_RT_CORES="$(zeroerr_cpu_list_except "$ZEROERR_ALL_CORES" "$ZEROERR_DEFAULT_CONTROL_CORES")"
  ZEROERR_DEFAULT_LOW_PRIORITY_CORES="0"
  if [ "$ZEROERR_CPU_COUNT" -ge 8 ]; then
    ZEROERR_DEFAULT_LOW_PRIORITY_CORES="0,1"
  fi
  ZEROERR_DEFAULT_PLANNER_CORES="$(zeroerr_cpu_list_except "$ZEROERR_DEFAULT_NON_RT_CORES" "$ZEROERR_DEFAULT_LOW_PRIORITY_CORES")"
elif [ "$ZEROERR_CPU_COUNT" -ge 8 ]; then
  # Development/workstation profile: keep the last core reserved for RT
  # control, let planning use the remaining high cores, and keep background
  # work on the first two cores.
  ZEROERR_DEFAULT_CONTROL_CORES="$((ZEROERR_CPU_COUNT - 1))"
  ZEROERR_DEFAULT_NON_RT_CORES="0-$((ZEROERR_CPU_COUNT - 2))"
  ZEROERR_DEFAULT_PLANNER_CORES="2-$((ZEROERR_CPU_COUNT - 2))"
  ZEROERR_DEFAULT_LOW_PRIORITY_CORES="0,1"
else
  # Four-core production profile:
  #   0     = Linux / GUI / diagnostics
  #   1,2   = MoveIt + IK/TOTG planning
  #   3     = EtherCAT + ros2_control RT
  ZEROERR_DEFAULT_CONTROL_CORES="3"
  ZEROERR_DEFAULT_NON_RT_CORES="0,1,2"
  ZEROERR_DEFAULT_PLANNER_CORES="1,2"
  ZEROERR_DEFAULT_LOW_PRIORITY_CORES="0"
fi

ZEROERR_ISOLATED_CORES="${ZEROERR_ISOLATED_CORES:-$ZEROERR_DEFAULT_CONTROL_CORES}"
ZEROERR_ETHERCAT_CORES="${ZEROERR_ETHERCAT_CORES:-$ZEROERR_DEFAULT_CONTROL_CORES}"
ZEROERR_CONTROL_CORES="${ZEROERR_CONTROL_CORES:-$ZEROERR_DEFAULT_CONTROL_CORES}"
ZEROERR_IRQ_CORES="${ZEROERR_IRQ_CORES:-$ZEROERR_ETHERCAT_CORES}"
ZEROERR_NON_RT_CORES="${ZEROERR_NON_RT_CORES:-$ZEROERR_DEFAULT_NON_RT_CORES}"
ZEROERR_PLANNER_CORES="${ZEROERR_PLANNER_CORES:-$ZEROERR_DEFAULT_PLANNER_CORES}"
ZEROERR_LOW_PRIORITY_CORES="${ZEROERR_LOW_PRIORITY_CORES:-$ZEROERR_DEFAULT_LOW_PRIORITY_CORES}"

ZEROERR_PIN_NON_RT_AWAY=1
ZEROERR_MOVE_NON_ETHERCAT_IRQS=1
ZEROERR_KEEP_ETHERCAT_RUNNING=1
ZEROERR_REUSE_ETHERCAT_MASTER=1

ZEROERR_ETHERCAT_SCRIPT="${SCRIPT_DIR}/src/eRob_ROS2_MoveIt/zeroerr/scripts/EtherCatStart.sh"
ZEROERR_SLAVE_MONITOR_SCRIPT=
