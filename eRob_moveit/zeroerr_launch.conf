# ZeroErr launcher config

  ROBOT_TYPE=zeroerr
  BUILD_WORKSPACE=0
  USE_RVIZ=false
  ROBOT_ROS_DOMAIN_ID=42
  ROBOT_ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
  ROBOT_ROS_LOCALHOST_ONLY=1

  WORKSPACE_DIR="${ROOT_WS_DIR}"
  ROS_SETUP_FILE="${ROS_SETUP_FILE:-${DEFAULT_ROS_SETUP_FILE}}"
  BASE_UNDERLAY_SETUP_FILE=
  WORKSPACE_SETUP_FILE="${ROOT_WS_DIR}/install/local_setup.bash"

  ZEROERR_PROFILE=full
  ZEROERR_PACKAGE=zeroerr
  ZEROERR_LAUNCH_FILE=demo.launch.py
  ZEROERR_MINIMAL_LAUNCH_FILE=ethercat_only.launch.py

  ZEROERR_NIC=enp1s0

  ZEROERR_ISOLATED_CORES=2,3
  ZEROERR_ISOLATED_MASK=0xC
  ZEROERR_IRQ_CORES=2
  ZEROERR_IRQ_MASK=0x4
  ZEROERR_ETHERCAT_CORES=2
  ZEROERR_CONTROL_CORES=3
  ZEROERR_PIN_NON_RT_AWAY=1
  ZEROERR_NON_RT_CORES=0,1

  ZEROERR_ETHERCAT_SCRIPT="${SCRIPT_DIR}/src/eRob_ROS2_MoveIt/zeroerr/scripts/EtherCatStart.sh"
  ZEROERR_SLAVE_MONITOR_SCRIPT=